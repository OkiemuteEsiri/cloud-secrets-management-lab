name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic inventory JSON
        run: python -m json.tool data/synthetic_inventory.json > /dev/null
